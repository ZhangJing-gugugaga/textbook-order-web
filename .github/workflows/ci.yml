name: CI

# 质量门禁（评审 E1/E2）：类型 → 格式 → 静态检查 → 单测（含覆盖率阈值）→ 构建 → E2E
# 任一环节失败即阻断合并；构建产物归档供部署取用。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20.19'

jobs:
  quality:
    name: 类型检查 / 格式 / 静态检查 / 单测 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖（锁定版本）
        run: npm ci

      - name: 生成文件无漂移校验（auto-import / components 声明）
        run: |
          npm run build
          if ! git diff --quiet -- src/types/auto-imports.d.ts src/types/components.d.ts; then
            echo "::error::src/types 下的自动生成声明与源码不一致，请在本地执行 npm run build 后提交"
            git --no-pager diff --stat -- src/types
            exit 1
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 代码格式检查（prettier）
        run: npm run format:check

      - name: 静态检查（eslint，零告警）
        run: npm run lint

      - name: 单元测试 + 覆盖率阈值
        run: npm run test:coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖（锁定版本）
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npm run test:e2e

      - name: 上传失败现场（trace / 截图 / 报告）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
